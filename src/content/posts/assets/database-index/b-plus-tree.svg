<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', system-ui, sans-serif">
  <rect width="720" height="340" fill="#f8f9fa"/>
  <defs>
    <marker id="bt-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#868e96"/></marker>
    <marker id="bt-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1864ab"/></marker>
  </defs>

  <!-- 행 이름 -->
  <g font-size="12" font-weight="600" fill="#6e747c">
    <text x="24" y="64">루트</text>
    <text x="24" y="154">중간 노드</text>
    <text x="24" y="240">리프 노드</text>
  </g>
  <text x="24" y="256" font-size="11" fill="#868e96">값 + 행 위치</text>

  <!-- 간선: 루트 → 중간 -->
  <g stroke="#ced4da" stroke-width="1.5" fill="none">
    <line x1="369" y1="80" x2="203" y2="130"/>
    <line x1="429" y1="80" x2="595" y2="130"/>
    <!-- 중간 → 리프 -->
    <line x1="187" y1="170" x2="154" y2="220"/>
    <line x1="219" y1="170" x2="252" y2="220"/>
    <line x1="383" y1="170" x2="350" y2="220"/>
    <line x1="579" y1="170" x2="546" y2="220"/>
    <line x1="611" y1="170" x2="644" y2="220"/>
  </g>
  <!-- 45를 찾는 경로 -->
  <g stroke="#12b886" stroke-width="2.5" fill="none">
    <line x1="399" y1="80" x2="399" y2="130"/>
    <line x1="415" y1="170" x2="448" y2="220"/>
  </g>

  <!-- 루트 -->
  <rect x="339" y="40" width="120" height="40" rx="6" fill="#fff" stroke="#12b886" stroke-width="2"/>
  <text x="399" y="65" text-anchor="middle" font-size="14" font-weight="700" fill="#16181b">30 │ 60</text>
  <text x="474" y="58" font-size="12" font-weight="600" fill="#087f5b">45 찾기: 세 노드만 거침</text>

  <!-- 중간 노드 -->
  <g font-size="14" font-weight="700" text-anchor="middle" fill="#16181b">
    <rect x="167" y="130" width="72" height="40" rx="6" fill="#fff" stroke="#dee2e6"/>
    <text x="203" y="155">15</text>
    <rect x="363" y="130" width="72" height="40" rx="6" fill="#fff" stroke="#12b886" stroke-width="2"/>
    <text x="399" y="155">45</text>
    <rect x="559" y="130" width="72" height="40" rx="6" fill="#fff" stroke="#dee2e6"/>
    <text x="595" y="155">75</text>
  </g>

  <!-- 리프 노드 -->
  <g font-size="13" font-weight="600" text-anchor="middle" fill="#454a51">
    <rect x="112" y="220" width="84" height="44" rx="6" fill="#fff" stroke="#dee2e6"/>
    <text x="154" y="247">5 · 10</text>
    <rect x="210" y="220" width="84" height="44" rx="6" fill="#fff" stroke="#dee2e6"/>
    <text x="252" y="247">15 · 20</text>
    <rect x="308" y="220" width="84" height="44" rx="6" fill="#e7f5ff" stroke="#74c0fc"/>
    <text x="350" y="247">30 · 40</text>
    <rect x="406" y="220" width="84" height="44" rx="6" fill="#e6fcf5" stroke="#12b886" stroke-width="2"/>
    <text x="448" y="247" fill="#087f5b" font-weight="700">45 · 50</text>
    <rect x="504" y="220" width="84" height="44" rx="6" fill="#e7f5ff" stroke="#74c0fc"/>
    <text x="546" y="247">60 · 70</text>
    <rect x="602" y="220" width="84" height="44" rx="6" fill="#fff" stroke="#dee2e6"/>
    <text x="644" y="247">75 · 80</text>
  </g>
  <!-- 리프 연결 -->
  <g stroke="#868e96" stroke-width="1.5">
    <line x1="197" y1="242" x2="208" y2="242" marker-end="url(#bt-g)"/>
    <line x1="295" y1="242" x2="306" y2="242" marker-end="url(#bt-g)"/>
    <line x1="393" y1="242" x2="404" y2="242" marker-end="url(#bt-g)"/>
    <line x1="491" y1="242" x2="502" y2="242" marker-end="url(#bt-g)"/>
    <line x1="589" y1="242" x2="600" y2="242" marker-end="url(#bt-g)"/>
  </g>

  <!-- 범위 조회 -->
  <line x1="320" y1="288" x2="576" y2="288" stroke="#1864ab" stroke-width="2" marker-end="url(#bt-b)"/>
  <line x1="320" y1="281" x2="320" y2="295" stroke="#1864ab" stroke-width="2"/>
  <text x="448" y="316" text-anchor="middle" font-size="12" font-weight="600" fill="#1864ab">40~70 범위 조회: 시작 리프를 찾은 뒤 옆으로 읽음</text>
</svg>
