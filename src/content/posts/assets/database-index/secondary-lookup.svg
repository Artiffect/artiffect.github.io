<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', system-ui, sans-serif">
  <rect width="720" height="350" fill="#f8f9fa"/>
  <defs>
    <marker id="sl-t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#12b886"/></marker>
  </defs>

  <!-- ===== 보조 인덱스 ===== -->
  <text x="174" y="36" text-anchor="middle" font-size="15" font-weight="700" fill="#16181b">보조 인덱스 <tspan font-size="13" font-weight="600" fill="#6e747c">idx_member_email</tspan></text>
  <rect x="24" y="52" width="300" height="200" rx="8" fill="#fff" stroke="#dee2e6"/>
  <g font-size="12" font-weight="700" fill="#6e747c">
    <text x="44" y="76">email</text>
    <text x="244" y="76">id (PK)</text>
  </g>
  <line x1="24" y1="86" x2="324" y2="86" stroke="#dee2e6"/>
  <line x1="228" y1="52" x2="228" y2="252" stroke="#e9ecef"/>
  <rect x="25" y="128" width="298" height="34" fill="#e6fcf5"/>
  <g font-size="13" fill="#454a51">
    <text x="44" y="112">ahn@example.com</text><text x="244" y="112">7</text>
    <text x="44" y="150" font-weight="700" fill="#087f5b">kim@example.com</text><text x="244" y="150" font-weight="700" fill="#087f5b">3</text>
    <text x="44" y="188">lee@example.com</text><text x="244" y="188">12</text>
    <text x="44" y="226">park@example.com</text><text x="244" y="226">5</text>
  </g>
  <circle cx="24" cy="145" r="11" fill="#12b886"/><text x="24" y="149.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">1</text>

  <!-- ===== 클러스터드 인덱스 ===== -->
  <text x="532" y="36" text-anchor="middle" font-size="15" font-weight="700" fill="#16181b">클러스터드 인덱스 <tspan font-size="13" font-weight="600" fill="#6e747c">PK</tspan></text>
  <rect x="368" y="52" width="328" height="200" rx="8" fill="#fff" stroke="#dee2e6"/>
  <g font-size="12" font-weight="700" fill="#6e747c">
    <text x="386" y="76">id</text>
    <text x="428" y="76">email</text>
    <text x="604" y="76">name</text>
  </g>
  <line x1="368" y1="86" x2="696" y2="86" stroke="#dee2e6"/>
  <rect x="369" y="90" width="326" height="34" fill="#e6fcf5"/>
  <g font-size="13" fill="#454a51">
    <text x="386" y="112" font-weight="700" fill="#087f5b">3</text><text x="428" y="112" font-weight="700" fill="#087f5b">kim@example.com</text><text x="604" y="112" font-weight="700" fill="#087f5b">김하늘</text>
    <text x="386" y="150">5</text><text x="428" y="150">park@example.com</text><text x="604" y="150">박서준</text>
    <text x="386" y="188">7</text><text x="428" y="188">ahn@example.com</text><text x="604" y="188">안지우</text>
    <text x="386" y="226">12</text><text x="428" y="226">lee@example.com</text><text x="604" y="226">이도윤</text>
  </g>
  <text x="680" y="76" text-anchor="end" font-size="11" fill="#868e96">행 전체</text>

  <!-- PK로 다시 찾기 -->
  <path d="M272 145 H346 V107 H364" fill="none" stroke="#12b886" stroke-width="2" marker-end="url(#sl-t)"/>
  <circle cx="346" cy="145" r="11" fill="#12b886"/><text x="346" y="149.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">2</text>

  <!-- 설명 -->
  <g font-size="12.5" fill="#454a51">
    <text x="24" y="286"><tspan font-weight="700" fill="#087f5b">1</tspan>  email로 보조 인덱스를 찾아 PK 3을 얻습니다.</text>
    <text x="24" y="308"><tspan font-weight="700" fill="#087f5b">2</tspan>  PK 3으로 클러스터드 인덱스를 다시 찾아 행 전체를 읽습니다.</text>
    <text x="24" y="330" fill="#6e747c">SELECT id, email처럼 인덱스 안의 컬럼만 쓰면 1에서 끝납니다 (커버링 인덱스).</text>
  </g>
</svg>
