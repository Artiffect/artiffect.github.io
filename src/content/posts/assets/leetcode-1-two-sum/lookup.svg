<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', system-ui, sans-serif">
  <rect width="720" height="380" fill="#f8f9fa"/>
  <text x="24" y="36" font-size="15" font-weight="700" fill="#343a40">nums = [4, 9, 2, 7], target = 9</text>
  <text x="60" y="74" text-anchor="middle" font-size="12" fill="#868e96">i</text>
  <text x="130" y="74" text-anchor="middle" font-size="12" fill="#868e96">nums[i]</text>
  <text x="250" y="74" text-anchor="middle" font-size="12" fill="#868e96">찾는 값 (9 − nums[i])</text>
  <text x="470" y="74" text-anchor="middle" font-size="12" fill="#868e96">찾을 때 맵에 있는 값 → 인덱스</text>
  <text x="650" y="74" text-anchor="middle" font-size="12" fill="#868e96">결과</text>
  <line x1="24" y1="86" x2="696" y2="86" stroke="#dee2e6"/>
  <text x="60" y="127.0" text-anchor="middle" font-size="14" fill="#868e96">0</text>
  <text x="130" y="127.0" text-anchor="middle" font-size="15" font-weight="700" fill="#343a40">4</text>
  <text x="250" y="127.0" text-anchor="middle" font-size="15" font-weight="700" fill="#343a40">5</text>
  <text x="470" y="127.0" text-anchor="middle" font-size="13" fill="#adb5bd">비어 있음</text>
  <text x="650" y="127.0" text-anchor="middle" font-size="13" fill="#495057">없음, 4 → 0 저장</text>
  <line x1="24" y1="152" x2="696" y2="152" stroke="#e9ecef"/>
  <text x="60" y="187.0" text-anchor="middle" font-size="14" fill="#868e96">1</text>
  <text x="130" y="187.0" text-anchor="middle" font-size="15" font-weight="700" fill="#343a40">9</text>
  <text x="250" y="187.0" text-anchor="middle" font-size="15" font-weight="700" fill="#343a40">0</text>
  <rect x="438" y="168" width="64" height="28" rx="6" fill="#fff" stroke="#dee2e6"/>
  <text x="470" y="187" text-anchor="middle" font-size="13" font-weight="500" fill="#495057">4 → 0</text>
  <text x="650" y="187.0" text-anchor="middle" font-size="13" fill="#495057">없음, 9 → 1 저장</text>
  <line x1="24" y1="212" x2="696" y2="212" stroke="#e9ecef"/>
  <text x="60" y="247.0" text-anchor="middle" font-size="14" fill="#868e96">2</text>
  <text x="130" y="247.0" text-anchor="middle" font-size="15" font-weight="700" fill="#343a40">2</text>
  <text x="250" y="247.0" text-anchor="middle" font-size="15" font-weight="700" fill="#343a40">7</text>
  <rect x="401" y="228" width="64" height="28" rx="6" fill="#fff" stroke="#dee2e6"/>
  <text x="433" y="247" text-anchor="middle" font-size="13" font-weight="500" fill="#495057">4 → 0</text>
  <rect x="475" y="228" width="64" height="28" rx="6" fill="#fff" stroke="#dee2e6"/>
  <text x="507" y="247" text-anchor="middle" font-size="13" font-weight="500" fill="#495057">9 → 1</text>
  <text x="650" y="247.0" text-anchor="middle" font-size="13" fill="#495057">없음, 2 → 2 저장</text>
  <line x1="24" y1="272" x2="696" y2="272" stroke="#e9ecef"/>
  <rect x="24" y="276" width="672" height="52" rx="8" fill="#e6fcf5" stroke="#12b886" stroke-width="2"/>
  <text x="60" y="307.0" text-anchor="middle" font-size="14" fill="#868e96">3</text>
  <text x="130" y="307.0" text-anchor="middle" font-size="15" font-weight="700" fill="#087f5b">7</text>
  <text x="250" y="307.0" text-anchor="middle" font-size="15" font-weight="700" fill="#087f5b">2</text>
  <rect x="364" y="288" width="64" height="28" rx="6" fill="#fff" stroke="#dee2e6"/>
  <text x="396" y="307" text-anchor="middle" font-size="13" font-weight="500" fill="#495057">4 → 0</text>
  <rect x="438" y="288" width="64" height="28" rx="6" fill="#fff" stroke="#dee2e6"/>
  <text x="470" y="307" text-anchor="middle" font-size="13" font-weight="500" fill="#495057">9 → 1</text>
  <rect x="512" y="288" width="64" height="28" rx="6" fill="#12b886" stroke="#12b886"/>
  <text x="544" y="307" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">2 → 2</text>
  <text x="650" y="307.0" text-anchor="middle" font-size="14" font-weight="700" fill="#087f5b">[2, 3] 반환</text>
  <text x="24" y="362" font-size="12" fill="#868e96">짝을 먼저 찾고, 없을 때만 현재 값을 맵에 넣습니다.</text>
</svg>
