<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', system-ui, sans-serif">
  <rect width="720" height="320" fill="#f8f9fa"/>

  <!-- 계층 이름 -->
  <text x="32" y="62" font-size="14" font-weight="700" fill="#16181b">애플리케이션</text>
  <text x="32" y="126" font-size="14" font-weight="700" fill="#16181b">전송</text>
  <text x="32" y="190" font-size="14" font-weight="700" fill="#16181b">네트워크</text>
  <text x="32" y="254" font-size="14" font-weight="700" fill="#16181b">데이터 링크</text>
  <text x="32" y="80" font-size="11" fill="#6e747c">메시지</text>
  <text x="32" y="144" font-size="11" fill="#6e747c">세그먼트</text>
  <text x="32" y="208" font-size="11" fill="#6e747c">패킷</text>
  <text x="32" y="272" font-size="11" fill="#6e747c">프레임</text>

  <!-- HTTP 메시지 (모든 줄 같은 자리) -->
  <g font-size="13" font-weight="600">
    <rect x="496" y="44" width="160" height="40" rx="4" fill="#e6fcf5" stroke="#12b886" stroke-width="1.5"/>
    <text x="576" y="69" text-anchor="middle" fill="#087f5b">HTTP 메시지</text>

    <rect x="496" y="108" width="160" height="40" rx="4" fill="#e6fcf5" stroke="#12b886" stroke-width="1.5"/>
    <text x="576" y="133" text-anchor="middle" fill="#087f5b">HTTP 메시지</text>

    <rect x="496" y="172" width="160" height="40" rx="4" fill="#e6fcf5" stroke="#12b886" stroke-width="1.5"/>
    <text x="576" y="197" text-anchor="middle" fill="#087f5b">HTTP 메시지</text>

    <rect x="496" y="236" width="160" height="40" rx="4" fill="#e6fcf5" stroke="#12b886" stroke-width="1.5"/>
    <text x="576" y="261" text-anchor="middle" fill="#087f5b">HTTP 메시지</text>
  </g>

  <!-- TCP 헤더 -->
  <g>
    <rect x="384" y="108" width="108" height="40" rx="4" fill="#fff" stroke="#adb5bd"/>
    <text x="438" y="126" text-anchor="middle" font-size="13" font-weight="700" fill="#16181b">TCP 헤더</text>
    <text x="438" y="141" text-anchor="middle" font-size="10.5" fill="#6e747c">포트 · 순서 번호</text>

    <rect x="384" y="172" width="108" height="40" rx="4" fill="#fff" stroke="#adb5bd"/>
    <text x="438" y="190" text-anchor="middle" font-size="13" font-weight="700" fill="#16181b">TCP 헤더</text>
    <text x="438" y="205" text-anchor="middle" font-size="10.5" fill="#6e747c">포트 · 순서 번호</text>

    <rect x="384" y="236" width="108" height="40" rx="4" fill="#fff" stroke="#adb5bd"/>
    <text x="438" y="254" text-anchor="middle" font-size="13" font-weight="700" fill="#16181b">TCP 헤더</text>
    <text x="438" y="269" text-anchor="middle" font-size="10.5" fill="#6e747c">포트 · 순서 번호</text>
  </g>

  <!-- IP 헤더 -->
  <g>
    <rect x="272" y="172" width="108" height="40" rx="4" fill="#f1f3f5" stroke="#adb5bd"/>
    <text x="326" y="190" text-anchor="middle" font-size="13" font-weight="700" fill="#16181b">IP 헤더</text>
    <text x="326" y="205" text-anchor="middle" font-size="10.5" fill="#6e747c">출발 · 도착 IP</text>

    <rect x="272" y="236" width="108" height="40" rx="4" fill="#f1f3f5" stroke="#adb5bd"/>
    <text x="326" y="254" text-anchor="middle" font-size="13" font-weight="700" fill="#16181b">IP 헤더</text>
    <text x="326" y="269" text-anchor="middle" font-size="10.5" fill="#6e747c">출발 · 도착 IP</text>
  </g>

  <!-- 이더넷 헤더 + 트레일러 -->
  <rect x="148" y="236" width="120" height="40" rx="4" fill="#e9ecef" stroke="#adb5bd"/>
  <text x="208" y="254" text-anchor="middle" font-size="13" font-weight="700" fill="#16181b">이더넷 헤더</text>
  <text x="208" y="269" text-anchor="middle" font-size="10.5" fill="#6e747c">다음 장비 MAC</text>
  <rect x="660" y="236" width="36" height="40" rx="4" fill="#e9ecef" stroke="#adb5bd"/>
  <text x="678" y="260" text-anchor="middle" font-size="10.5" fill="#6e747c">FCS</text>

  <!-- 내려가는 화살표 -->
  <g stroke="#868e96" stroke-width="1.5" fill="none">
    <path d="M700 64 V112"/><path d="M700 128 V176"/><path d="M700 192 V224"/>
  </g>
  <g fill="#868e96">
    <path d="M695 106 L700 114 L705 106z"/><path d="M695 170 L700 178 L705 170z"/><path d="M695 218 L700 226 L705 218z"/>
  </g>
  <text x="684" y="34" text-anchor="end" font-size="11" fill="#6e747c">내려갈수록 헤더가 앞에 붙음</text>
</svg>
