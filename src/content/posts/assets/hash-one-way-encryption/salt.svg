<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 396" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', system-ui, sans-serif">
  <rect width="720" height="396" fill="#f8f9fa"/>
  <defs>
    <marker id="hs-sn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#868e96"/></marker>
  </defs>

  <!-- ===== 솔트 없이 ===== -->
  <text x="32" y="36" font-size="15" font-weight="700" fill="#343a40">솔트 없이 해시만</text>

  <g font-size="13" font-weight="700" fill="#343a40">
