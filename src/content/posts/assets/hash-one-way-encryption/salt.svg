    <text x="32" y="136">사용자 B</text>
  </g>
  <g text-anchor="middle">
    <rect x="112" y="54" width="208" height="40" rx="8" fill="#fff" stroke="#dee2e6"/>
    <text x="216" y="79" font-size="13" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#343a40">password123</text>
    <rect x="112" y="110" width="208" height="40" rx="8" fill="#fff" stroke="#dee2e6"/>
    <text x="216" y="135" font-size="13" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#343a40">password123</text>

    <rect x="360" y="54" width="88" height="40" rx="8" fill="#fff" stroke="#adb5bd"/>
