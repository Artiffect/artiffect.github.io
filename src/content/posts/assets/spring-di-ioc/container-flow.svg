    <text x="386" y="108" font-size="11" fill="#6e747c">생성자에 넣고 초기화</text>
  </g>
  <g>
    <rect x="542" y="32" width="150" height="96" rx="8" fill="#fff" stroke="#dee2e6"/>
    <circle cx="564" cy="56" r="11" fill="#12b886"/><text x="564" y="60.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">4</text>
    <text x="582" y="61" font-size="14" font-weight="700" fill="#16181b">사용</text>
    <text x="556" y="90" font-size="11" fill="#6e747c">다른 빈에 주입</text>
    <text x="556" y="108" font-size="11" fill="#6e747c">getBean()으로 조회</text>
  </g>
  <g stroke="#868e96" stroke-width="1.5">
    <line x1="182" y1="80" x2="198" y2="80" marker-end="url(#cf-ah)"/>
    <line x1="352" y1="80" x2="368" y2="80" marker-end="url(#cf-ah)"/>
    <line x1="522" y1="80" x2="538" y2="80" marker-end="url(#cf-ah)"/>
