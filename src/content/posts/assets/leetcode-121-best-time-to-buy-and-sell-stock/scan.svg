<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', system-ui, sans-serif">
  <rect width="720" height="470" fill="#f8f9fa"/>
  <text x="24" y="36" text-anchor="start" font-size="15" font-weight="700" fill="#343a40">prices = [7, 1, 5, 3, 6, 4]</text>
  <text x="60" y="74" text-anchor="middle" font-size="12" font-weight="400" fill="#868e96">날짜 i</text>
  <text x="140" y="74" text-anchor="middle" font-size="12" font-weight="400" fill="#868e96">주가</text>
  <text x="250" y="74" text-anchor="middle" font-size="12" font-weight="400" fill="#868e96">지금까지 최저가</text>
  <text x="380" y="74" text-anchor="middle" font-size="12" font-weight="400" fill="#868e96">오늘 팔면 이익</text>
  <text x="500" y="74" text-anchor="middle" font-size="12" font-weight="400" fill="#868e96">최대 이익</text>
  <text x="620" y="74" text-anchor="middle" font-size="12" font-weight="400" fill="#868e96"></text>
  <line x1="24" y1="86" x2="696" y2="86" stroke="#dee2e6"/>
  <text x="60" y="125.0" text-anchor="middle" font-size="14" font-weight="400" fill="#868e96">0</text>
  <text x="140" y="125.0" text-anchor="middle" font-size="15" font-weight="700" fill="#343a40">7</text>
  <text x="250" y="125.0" text-anchor="middle" font-size="15" font-weight="500" fill="#343a40">7</text>
  <text x="380" y="125.0" text-anchor="middle" font-size="14" font-weight="500" fill="#868e96">—</text>
  <text x="500" y="125.0" text-anchor="middle" font-size="15" font-weight="700" fill="#343a40">0</text>
  <text x="620" y="125.0" text-anchor="middle" font-size="13" font-weight="500" fill="#868e96">첫날, 최저가로 시작</text>
  <line x1="24" y1="148" x2="696" y2="148" stroke="#e9ecef"/>
  <text x="60" y="181.0" text-anchor="middle" font-size="14" font-weight="400" fill="#868e96">1</text>
  <text x="140" y="181.0" text-anchor="middle" font-size="15" font-weight="700" fill="#343a40">1</text>
  <text x="250" y="181.0" text-anchor="middle" font-size="15" font-weight="700" fill="#087f5b">1</text>
  <text x="380" y="181.0" text-anchor="middle" font-size="14" font-weight="500" fill="#868e96">—</text>
  <text x="500" y="181.0" text-anchor="middle" font-size="15" font-weight="700" fill="#343a40">0</text>
  <text x="620" y="181.0" text-anchor="middle" font-size="13" font-weight="500" fill="#087f5b">최저가 갱신</text>
  <line x1="24" y1="204" x2="696" y2="204" stroke="#e9ecef"/>
  <text x="60" y="237.0" text-anchor="middle" font-size="14" font-weight="400" fill="#868e96">2</text>
  <text x="140" y="237.0" text-anchor="middle" font-size="15" font-weight="700" fill="#343a40">5</text>
  <text x="250" y="237.0" text-anchor="middle" font-size="15" font-weight="500" fill="#343a40">1</text>
  <text x="380" y="237.0" text-anchor="middle" font-size="14" font-weight="500" fill="#343a40">5 − 1 = 4</text>
  <text x="500" y="237.0" text-anchor="middle" font-size="15" font-weight="700" fill="#343a40">4</text>
  <text x="620" y="237.0" text-anchor="middle" font-size="13" font-weight="500" fill="#868e96">최대 이익 갱신</text>
  <line x1="24" y1="260" x2="696" y2="260" stroke="#e9ecef"/>
  <text x="60" y="293.0" text-anchor="middle" font-size="14" font-weight="400" fill="#868e96">3</text>
  <text x="140" y="293.0" text-anchor="middle" font-size="15" font-weight="700" fill="#343a40">3</text>
  <text x="250" y="293.0" text-anchor="middle" font-size="15" font-weight="500" fill="#343a40">1</text>
  <text x="380" y="293.0" text-anchor="middle" font-size="14" font-weight="500" fill="#343a40">3 − 1 = 2</text>
  <text x="500" y="293.0" text-anchor="middle" font-size="15" font-weight="700" fill="#343a40">4</text>
  <rect x="24" y="320" width="672" height="48" rx="8" fill="#e6fcf5" stroke="#12b886" stroke-width="2"/>
  <text x="60" y="349.0" text-anchor="middle" font-size="14" font-weight="400" fill="#868e96">4</text>
  <text x="140" y="349.0" text-anchor="middle" font-size="15" font-weight="700" fill="#087f5b">6</text>
  <text x="250" y="349.0" text-anchor="middle" font-size="15" font-weight="700" fill="#087f5b">1</text>
  <text x="380" y="349.0" text-anchor="middle" font-size="14" font-weight="700" fill="#087f5b">6 − 1 = 5</text>
  <text x="500" y="349.0" text-anchor="middle" font-size="15" font-weight="700" fill="#087f5b">5</text>
  <text x="620" y="349.0" text-anchor="middle" font-size="13" font-weight="700" fill="#087f5b">최대 이익 갱신</text>
  <text x="60" y="405.0" text-anchor="middle" font-size="14" font-weight="400" fill="#868e96">5</text>
  <text x="140" y="405.0" text-anchor="middle" font-size="15" font-weight="700" fill="#343a40">4</text>
  <text x="250" y="405.0" text-anchor="middle" font-size="15" font-weight="500" fill="#343a40">1</text>
  <text x="380" y="405.0" text-anchor="middle" font-size="14" font-weight="500" fill="#343a40">4 − 1 = 3</text>
  <text x="500" y="405.0" text-anchor="middle" font-size="15" font-weight="700" fill="#343a40">5</text>
  <text x="24" y="452" text-anchor="start" font-size="12" font-weight="400" fill="#868e96">최저가가 바뀌는 날은 이익을 계산하지 않습니다. 답은 1에 사서 6에 파는 5입니다.</text>
</svg>
