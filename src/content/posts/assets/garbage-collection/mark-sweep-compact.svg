<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', system-ui, sans-serif">
  <rect width="720" height="320" fill="#f8f9fa"/>

  <!-- 단계 이름 -->
  <g>
    <text x="24" y="62" font-size="14" font-weight="700" fill="#087f5b">1. Mark</text>
    <text x="24" y="82" font-size="12" fill="#868e96">살아 있는 객체 표시</text>
    <text x="24" y="154" font-size="14" font-weight="700" fill="#087f5b">2. Sweep</text>
    <text x="24" y="174" font-size="12" fill="#868e96">표시 없는 객체 해제</text>
    <text x="24" y="246" font-size="14" font-weight="700" fill="#087f5b">3. Compact</text>
    <text x="24" y="266" font-size="12" fill="#868e96">남은 객체를 한쪽으로</text>
  </g>

  <!-- 1. Mark: L G L G G L L G L G -->
  <g font-size="13" font-weight="700" text-anchor="middle">
    <rect x="180" y="40" width="48" height="44" rx="5" fill="#e6fcf5" stroke="#12b886" stroke-width="2"/><text x="204" y="67" fill="#087f5b">A</text>
    <rect x="232" y="40" width="48" height="44" rx="5" fill="#fff" stroke="#adb5bd" stroke-width="1.5" stroke-dasharray="4 3"/>
    <rect x="284" y="40" width="48" height="44" rx="5" fill="#e6fcf5" stroke="#12b886" stroke-width="2"/><text x="308" y="67" fill="#087f5b">B</text>
    <rect x="336" y="40" width="48" height="44" rx="5" fill="#fff" stroke="#adb5bd" stroke-width="1.5" stroke-dasharray="4 3"/>
    <rect x="388" y="40" width="48" height="44" rx="5" fill="#fff" stroke="#adb5bd" stroke-width="1.5" stroke-dasharray="4 3"/>
    <rect x="440" y="40" width="48" height="44" rx="5" fill="#e6fcf5" stroke="#12b886" stroke-width="2"/><text x="464" y="67" fill="#087f5b">C</text>
    <rect x="492" y="40" width="48" height="44" rx="5" fill="#e6fcf5" stroke="#12b886" stroke-width="2"/><text x="516" y="67" fill="#087f5b">D</text>
    <rect x="544" y="40" width="48" height="44" rx="5" fill="#fff" stroke="#adb5bd" stroke-width="1.5" stroke-dasharray="4 3"/>
    <rect x="596" y="40" width="48" height="44" rx="5" fill="#e6fcf5" stroke="#12b886" stroke-width="2"/><text x="620" y="67" fill="#087f5b">E</text>
    <rect x="648" y="40" width="48" height="44" rx="5" fill="#fff" stroke="#adb5bd" stroke-width="1.5" stroke-dasharray="4 3"/>
  </g>
  <text x="180" y="106" font-size="11.5" fill="#868e96">Root에서 닿은 A~E에 표시, 점선은 닿지 않은 객체</text>

  <!-- 2. Sweep -->
  <g font-size="13" font-weight="700" text-anchor="middle">
    <rect x="180" y="132" width="48" height="44" rx="5" fill="#e6fcf5" stroke="#12b886"/><text x="204" y="159" fill="#087f5b">A</text>
    <rect x="232" y="132" width="48" height="44" rx="5" fill="#f1f3f5"/>
    <rect x="284" y="132" width="48" height="44" rx="5" fill="#e6fcf5" stroke="#12b886"/><text x="308" y="159" fill="#087f5b">B</text>
    <rect x="336" y="132" width="48" height="44" rx="5" fill="#f1f3f5"/>
    <rect x="388" y="132" width="48" height="44" rx="5" fill="#f1f3f5"/>
    <rect x="440" y="132" width="48" height="44" rx="5" fill="#e6fcf5" stroke="#12b886"/><text x="464" y="159" fill="#087f5b">C</text>
    <rect x="492" y="132" width="48" height="44" rx="5" fill="#e6fcf5" stroke="#12b886"/><text x="516" y="159" fill="#087f5b">D</text>
    <rect x="544" y="132" width="48" height="44" rx="5" fill="#f1f3f5"/>
    <rect x="596" y="132" width="48" height="44" rx="5" fill="#e6fcf5" stroke="#12b886"/><text x="620" y="159" fill="#087f5b">E</text>
    <rect x="648" y="132" width="48" height="44" rx="5" fill="#f1f3f5"/>
  </g>
  <text x="180" y="198" font-size="11.5" fill="#868e96">빈 칸은 다섯 개지만 가장 길게 이어진 곳은 두 칸</text>

  <!-- 3. Compact -->
  <g font-size="13" font-weight="700" text-anchor="middle">
    <rect x="180" y="224" width="48" height="44" rx="5" fill="#e6fcf5" stroke="#12b886"/><text x="204" y="251" fill="#087f5b">A</text>
    <rect x="232" y="224" width="48" height="44" rx="5" fill="#e6fcf5" stroke="#12b886"/><text x="256" y="251" fill="#087f5b">B</text>
    <rect x="284" y="224" width="48" height="44" rx="5" fill="#e6fcf5" stroke="#12b886"/><text x="308" y="251" fill="#087f5b">C</text>
    <rect x="336" y="224" width="48" height="44" rx="5" fill="#e6fcf5" stroke="#12b886"/><text x="360" y="251" fill="#087f5b">D</text>
    <rect x="388" y="224" width="48" height="44" rx="5" fill="#e6fcf5" stroke="#12b886"/><text x="412" y="251" fill="#087f5b">E</text>
    <rect x="440" y="224" width="256" height="44" rx="5" fill="#f1f3f5"/>
  </g>
  <path d="M440 278 V284 H696 V278" fill="none" stroke="#12b886" stroke-width="1.5"/>
  <text x="568" y="302" text-anchor="middle" font-size="11.5" font-weight="600" fill="#087f5b">이어진 빈 공간 다섯 칸</text>
  <text x="180" y="290" font-size="11.5" fill="#868e96">새 객체는 E 뒤에 이어 붙임</text>
</svg>
