<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 444" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', system-ui, sans-serif">
  <rect width="720" height="444" fill="#f8f9fa"/>
  <defs>
    <marker id="cs-sw-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#868e96"/>
    </marker>
  </defs>

  <!-- 전환 구간 -->
  <rect x="24" y="118" width="672" height="88" fill="#e9ecef" opacity="0.7"/>
  <rect x="24" y="264" width="672" height="88" fill="#e9ecef" opacity="0.7"/>
  <g font-size="12" font-weight="700" fill="#868e96">
    <text x="36" y="166">전환 중</text>
    <text x="36" y="312">전환 중</text>
  </g>

  <!-- 머리글 -->
  <g font-size="15" font-weight="700" text-anchor="middle" fill="#16181b">
    <text x="140" y="36">프로세스 A</text>
    <text x="360" y="36">운영체제(커널)</text>
    <text x="580" y="36">프로세스 B</text>
  </g>

  <!-- 프로세스 A -->
  <rect x="133" y="56" width="14" height="62" rx="3" fill="#12b886"/>
  <line x1="140" y1="118" x2="140" y2="352" stroke="#ced4da" stroke-width="2" stroke-dasharray="5 4"/>
  <rect x="133" y="352" width="14" height="52" rx="3" fill="#12b886"/>

  <!-- 프로세스 B -->
  <line x1="580" y1="56" x2="580" y2="206" stroke="#ced4da" stroke-width="2" stroke-dasharray="5 4"/>
  <rect x="573" y="206" width="14" height="58" rx="3" fill="#12b886"/>
  <line x1="580" y1="264" x2="580" y2="404" stroke="#ced4da" stroke-width="2" stroke-dasharray="5 4"/>

  <g font-size="12.5" font-weight="700">
    <text x="160" y="92" fill="#087f5b">실행</text>
    <text x="160" y="240" fill="#868e96">대기</text>
    <text x="160" y="384" fill="#087f5b">실행</text>
    <text x="600" y="92" fill="#868e96">대기</text>
    <text x="600" y="240" fill="#087f5b">실행</text>
    <text x="600" y="384" fill="#868e96">대기</text>
  </g>

  <!-- 커널 작업 -->
  <g font-size="13" text-anchor="middle" fill="#343a40">
    <rect x="250" y="128" width="220" height="30" rx="6" fill="#fff" stroke="#dee2e6"/>
    <text x="360" y="148">A의 상태를 PCB A에 저장</text>
    <rect x="250" y="166" width="220" height="30" rx="6" fill="#fff" stroke="#dee2e6"/>
    <text x="360" y="186">PCB B에서 상태 복원</text>
    <rect x="250" y="274" width="220" height="30" rx="6" fill="#fff" stroke="#dee2e6"/>
    <text x="360" y="294">B의 상태를 PCB B에 저장</text>
    <rect x="250" y="312" width="220" height="30" rx="6" fill="#fff" stroke="#dee2e6"/>
    <text x="360" y="332">PCB A에서 상태 복원</text>
  </g>

  <!-- 화살표 -->
  <g stroke="#868e96" stroke-width="1.5" fill="none" marker-end="url(#cs-sw-ah)">
    <line x1="148" y1="119" x2="246" y2="140"/>
    <line x1="472" y1="184" x2="570" y2="206"/>
    <line x1="572" y1="265" x2="474" y2="286"/>
    <line x1="248" y1="330" x2="150" y2="351"/>
  </g>

  <text x="360" y="430" text-anchor="middle" font-size="12" fill="#868e96">회색 구간에서는 커널만 일하고 A와 B는 진행하지 않습니다</text>
</svg>
