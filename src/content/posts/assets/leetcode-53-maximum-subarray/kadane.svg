  <text x="24" y="514" text-anchor="start" font-size="12" font-weight="400" fill="#868e96">curSum + nums[i]가 nums[i]보다 작으면(앞의 합이 음수면) nums[i]부터 새로 시작합니다. 답은 [4, -1, 2, 1]의 합 6입니다.</text>
