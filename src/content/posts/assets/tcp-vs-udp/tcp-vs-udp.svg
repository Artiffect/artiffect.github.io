<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', system-ui, sans-serif">
  <rect width="720" height="420" fill="#f8f9fa"/>
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#868e96"/></marker>
    <marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#12b886"/></marker>
  </defs>
  <line x1="360" y1="20" x2="360" y2="400" stroke="#dee2e6"/>

  <!-- ===== TCP ===== -->
  <text x="180" y="36" text-anchor="middle" font-size="17" font-weight="700" fill="#087f5b">TCP</text>
  <text x="72" y="64" text-anchor="middle" font-size="13" font-weight="600" fill="#454a51">클라이언트</text>
  <text x="288" y="64" text-anchor="middle" font-size="13" font-weight="600" fill="#454a51">서버</text>
  <line x1="72" y1="74" x2="72" y2="396" stroke="#adb5bd" stroke-width="2"/>
  <line x1="288" y1="74" x2="288" y2="396" stroke="#adb5bd" stroke-width="2"/>

  <!-- 연결 -->
  <rect x="20" y="82" width="320" height="104" rx="6" fill="#e6fcf5" opacity="0.6"/>
  <text x="28" y="98" font-size="11" font-weight="600" fill="#087f5b">연결</text>
  <line x1="74" y1="104" x2="284" y2="124" stroke="#12b886" stroke-width="1.5" marker-end="url(#t)"/>
  <text x="180" y="106" text-anchor="middle" font-size="12" fill="#16181b">SYN</text>
  <line x1="286" y1="136" x2="76" y2="156" stroke="#12b886" stroke-width="1.5" marker-end="url(#t)"/>
  <text x="180" y="138" text-anchor="middle" font-size="12" fill="#16181b">SYN+ACK</text>
  <line x1="74" y1="166" x2="284" y2="180" stroke="#12b886" stroke-width="1.5" marker-end="url(#t)"/>
  <text x="180" y="166" text-anchor="middle" font-size="12" fill="#16181b">ACK</text>

  <!-- 데이터 1 -->
  <line x1="74" y1="204" x2="284" y2="222" stroke="#868e96" stroke-width="1.5" marker-end="url(#g)"/>
  <text x="180" y="206" text-anchor="middle" font-size="12" fill="#16181b">데이터 1</text>
  <line x1="286" y1="230" x2="76" y2="248" stroke="#868e96" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#g)"/>
  <text x="180" y="232" text-anchor="middle" font-size="12" fill="#6e747c">ACK</text>

  <!-- 데이터 2 유실 -->
  <line x1="74" y1="264" x2="190" y2="276" stroke="#868e96" stroke-width="1.5"/>
  <text x="128" y="262" text-anchor="middle" font-size="12" fill="#16181b">데이터 2</text>
  <g stroke="#e8590c" stroke-width="2.5"><line x1="190" y1="268" x2="204" y2="282"/><line x1="204" y1="268" x2="190" y2="282"/></g>
  <text x="214" y="286" font-size="11" fill="#e8590c">유실</text>

  <!-- 타임아웃 → 재전송 -->
  <path d="M60 280 V330" stroke="#adb5bd" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="56" y="310" text-anchor="end" font-size="10.5" fill="#6e747c">ACK가</text>
  <text x="56" y="324" text-anchor="end" font-size="10.5" fill="#6e747c">안 옴</text>
  <line x1="74" y1="334" x2="284" y2="352" stroke="#12b886" stroke-width="1.5" marker-end="url(#t)"/>
  <text x="180" y="336" text-anchor="middle" font-size="12" font-weight="700" fill="#087f5b">데이터 2 재전송</text>
  <line x1="286" y1="362" x2="76" y2="380" stroke="#868e96" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#g)"/>
  <text x="180" y="364" text-anchor="middle" font-size="12" fill="#6e747c">ACK</text>

  <!-- ===== UDP ===== -->
  <text x="540" y="36" text-anchor="middle" font-size="17" font-weight="700" fill="#16181b">UDP</text>
  <text x="432" y="64" text-anchor="middle" font-size="13" font-weight="600" fill="#454a51">클라이언트</text>
  <text x="648" y="64" text-anchor="middle" font-size="13" font-weight="600" fill="#454a51">서버</text>
  <line x1="432" y1="74" x2="432" y2="396" stroke="#adb5bd" stroke-width="2"/>
  <line x1="648" y1="74" x2="648" y2="396" stroke="#adb5bd" stroke-width="2"/>

  <text x="540" y="120" text-anchor="middle" font-size="12" fill="#6e747c">연결 단계 없음</text>

  <line x1="434" y1="204" x2="644" y2="222" stroke="#868e96" stroke-width="1.5" marker-end="url(#g)"/>
  <text x="540" y="206" text-anchor="middle" font-size="12" fill="#16181b">데이터 1</text>

  <line x1="434" y1="240" x2="550" y2="250" stroke="#868e96" stroke-width="1.5"/>
  <text x="488" y="238" text-anchor="middle" font-size="12" fill="#16181b">데이터 2</text>
  <g stroke="#e8590c" stroke-width="2.5"><line x1="550" y1="243" x2="564" y2="257"/><line x1="564" y1="243" x2="550" y2="257"/></g>
  <text x="574" y="261" font-size="11" fill="#e8590c">유실</text>

  <line x1="434" y1="276" x2="644" y2="294" stroke="#868e96" stroke-width="1.5" marker-end="url(#g)"/>
  <text x="540" y="278" text-anchor="middle" font-size="12" fill="#16181b">데이터 3</text>

  <text x="540" y="340" text-anchor="middle" font-size="12" fill="#6e747c">확인 응답도, 재전송도 없음</text>
  <text x="540" y="358" text-anchor="middle" font-size="12" fill="#6e747c">서버는 1, 3만 받음</text>
</svg>
