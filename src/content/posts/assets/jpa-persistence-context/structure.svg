<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 344" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', system-ui, sans-serif">
  <rect width="720" height="344" fill="#f8f9fa"/>
  <defs>
    <marker id="pc-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#868e96"/>
    </marker>
    <marker id="pc-gr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#12b886"/>
    </marker>
  </defs>

  <!-- 애플리케이션 -->
  <rect x="24" y="104" width="112" height="200" rx="8" fill="#fff" stroke="#dee2e6"/>
  <text x="80" y="132" text-anchor="middle" font-size="14" font-weight="700" fill="#16181b">애플리케이션</text>
  <text x="80" y="152" text-anchor="middle" font-size="11.5" fill="#6e747c">EntityManager</text>

  <!-- 영속성 컨텍스트 -->
  <rect x="196" y="24" width="340" height="296" rx="10" fill="#fff" stroke="#12b886" stroke-width="1.5"/>
  <text x="366" y="52" text-anchor="middle" font-size="15" font-weight="700" fill="#087f5b">영속성 컨텍스트</text>

  <!-- 1차 캐시 -->
  <text x="212" y="82" font-size="12.5" font-weight="700" fill="#454a51">1차 캐시</text>
  <rect x="212" y="92" width="308" height="104" rx="6" fill="#fff" stroke="#dee2e6"/>
  <path d="M212 98 a6 6 0 0 1 6 -6 h296 a6 6 0 0 1 6 6 v22 h-308 z" fill="#e6fcf5"/>
  <line x1="212" y1="120" x2="520" y2="120" stroke="#dee2e6"/>
  <line x1="212" y1="158" x2="520" y2="158" stroke="#e9ecef"/>
  <line x1="272" y1="92" x2="272" y2="196" stroke="#e9ecef"/>
  <line x1="396" y1="92" x2="396" y2="196" stroke="#e9ecef"/>
  <g font-size="12" font-weight="700" fill="#087f5b" text-anchor="middle">
    <text x="242" y="110">@Id</text>
    <text x="334" y="110">엔티티</text>
    <text x="458" y="110">스냅숏</text>
  </g>
  <g font-size="12" fill="#16181b" text-anchor="middle">
    <text x="242" y="144">1L</text>
    <text x="334" y="144">member1</text>
    <text x="458" y="144" fill="#6e747c">조회 시점 상태</text>
    <text x="242" y="182">2L</text>
    <text x="334" y="182">member2</text>
    <text x="458" y="182" fill="#6e747c">조회 시점 상태</text>
  </g>

  <!-- 쓰기 지연 SQL 저장소 -->
  <text x="212" y="230" font-size="12.5" font-weight="700" fill="#454a51">쓰기 지연 SQL 저장소</text>
  <rect x="212" y="240" width="308" height="64" rx="6" fill="#fff" stroke="#dee2e6"/>
  <g font-size="11.5" fill="#1864ab" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">
    <rect x="224" y="250" width="284" height="20" rx="4" fill="#e7f5ff"/>
    <text x="234" y="264">INSERT INTO member ... (member3)</text>
    <rect x="224" y="274" width="284" height="20" rx="4" fill="#e7f5ff"/>
    <text x="234" y="288">INSERT INTO member ... (member4)</text>
  </g>

  <!-- DB -->
  <g>
    <path d="M600 112 v176 a48 14 0 0 0 96 0 v-176" fill="#fff" stroke="#adb5bd" stroke-width="1.5"/>
    <ellipse cx="648" cy="112" rx="48" ry="14" fill="#f1f3f5" stroke="#adb5bd" stroke-width="1.5"/>
    <text x="648" y="206" text-anchor="middle" font-size="15" font-weight="700" fill="#16181b">DB</text>
  </g>

  <!-- 화살표: 애플리케이션 → 컨텍스트 -->
  <line x1="136" y1="158" x2="208" y2="158" stroke="#868e96" stroke-width="1.5" marker-end="url(#pc-ah)"/>
  <text x="168" y="150" text-anchor="middle" font-size="11.5" fill="#454a51">find()</text>
  <line x1="136" y1="272" x2="208" y2="272" stroke="#868e96" stroke-width="1.5" marker-end="url(#pc-ah)"/>
  <text x="168" y="264" text-anchor="middle" font-size="11.5" fill="#454a51">persist()</text>

  <!-- 화살표: 컨텍스트 ↔ DB -->
  <line x1="522" y1="144" x2="596" y2="144" stroke="#868e96" stroke-width="1.5" marker-end="url(#pc-ah)"/>
  <text x="566" y="136" text-anchor="middle" font-size="11.5" fill="#454a51">없으면</text>
  <text x="566" y="160" text-anchor="middle" font-size="11.5" fill="#454a51">SELECT</text>
  <line x1="522" y1="272" x2="596" y2="272" stroke="#12b886" stroke-width="1.5" marker-end="url(#pc-gr)"/>
  <text x="566" y="264" text-anchor="middle" font-size="11.5" font-weight="600" fill="#087f5b">flush 때</text>
  <text x="566" y="288" text-anchor="middle" font-size="11.5" font-weight="600" fill="#087f5b">전송</text>
</svg>
