<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', system-ui, sans-serif">
  <rect width="720" height="340" fill="#f8f9fa"/>
  <defs>
    <marker id="dc-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#868e96"/>
    </marker>
    <marker id="dc-gr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#12b886"/>
    </marker>
  </defs>

  <!-- 1. 커밋 요청 -->
  <rect x="24" y="104" width="120" height="68" rx="8" fill="#fff" stroke="#dee2e6"/>
  <circle cx="46" cy="126" r="11" fill="#12b886"/><text x="46" y="130.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">1</text>
  <text x="64" y="131" font-size="14" font-weight="700" fill="#16181b">커밋</text>
  <text x="40" y="158" font-size="11.5" fill="#6e747c" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">tx.commit()</text>

  <line x1="144" y1="138" x2="180" y2="138" stroke="#868e96" stroke-width="1.5" marker-end="url(#dc-ah)"/>

  <!-- 2. flush: 비교 -->
  <rect x="184" y="24" width="352" height="212" rx="10" fill="#fff" stroke="#12b886" stroke-width="1.5"/>
  <circle cx="206" cy="48" r="11" fill="#12b886"/><text x="206" y="52.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">2</text>
  <text x="224" y="53" font-size="14" font-weight="700" fill="#16181b">flush: 엔티티와 스냅숏 비교</text>

  <!-- 엔티티 -->
  <text x="272" y="84" text-anchor="middle" font-size="12" font-weight="700" fill="#454a51">지금 엔티티</text>
  <rect x="204" y="94" width="136" height="104" rx="6" fill="#fff" stroke="#dee2e6"/>
  <!-- 스냅숏 -->
  <text x="448" y="84" text-anchor="middle" font-size="12" font-weight="700" fill="#454a51">스냅숏 (조회 시점)</text>
  <rect x="380" y="94" width="136" height="104" rx="6" fill="#fff" stroke="#dee2e6"/>

  <!-- 바뀐 행 강조 -->
  <rect x="208" y="130" width="128" height="28" rx="4" fill="#fff4e6" stroke="#e8590c" stroke-width="1.5"/>
  <rect x="384" y="130" width="128" height="28" rx="4" fill="#fff4e6" stroke="#e8590c" stroke-width="1.5"/>

  <g font-size="12.5" fill="#6e747c">
    <text x="218" y="120">id</text><text x="218" y="149">name</text><text x="218" y="182">age</text>
    <text x="394" y="120">id</text><text x="394" y="149">name</text><text x="394" y="182">age</text>
  </g>
  <g font-size="12.5" font-weight="600" fill="#16181b" text-anchor="end">
    <text x="328" y="120">1</text><text x="328" y="149" fill="#e8590c">새 이름</text><text x="328" y="182">20</text>
    <text x="504" y="120">1</text><text x="504" y="149" fill="#e8590c">회원1</text><text x="504" y="182">20</text>
  </g>
  <g font-size="14" font-weight="700" text-anchor="middle">
    <text x="360" y="124" fill="#adb5bd">=</text>
    <text x="360" y="150" fill="#e8590c">≠</text>
    <text x="360" y="186" fill="#adb5bd">=</text>
  </g>
  <text x="360" y="222" text-anchor="middle" font-size="12" font-weight="600" fill="#e8590c">name이 바뀜 → UPDATE 생성</text>

  <!-- 3. UPDATE SQL -->
  <line x1="360" y1="236" x2="360" y2="262" stroke="#868e96" stroke-width="1.5" marker-end="url(#dc-ah)"/>
  <rect x="184" y="266" width="352" height="48" rx="8" fill="#fff" stroke="#dee2e6"/>
  <circle cx="206" cy="290" r="11" fill="#12b886"/><text x="206" y="294.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">3</text>
  <text x="226" y="294.5" font-size="11.5" fill="#1864ab" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">UPDATE member SET name=?, age=? WHERE id=?</text>

  <!-- 4. DB -->
  <line x1="536" y1="290" x2="588" y2="290" stroke="#12b886" stroke-width="1.5" marker-end="url(#dc-gr)"/>
  <text x="562" y="282" text-anchor="middle" font-size="11.5" font-weight="600" fill="#087f5b">전송</text>
  <g>
    <path d="M600 120 v164 a48 14 0 0 0 96 0 v-164" fill="#fff" stroke="#adb5bd" stroke-width="1.5"/>
    <ellipse cx="648" cy="120" rx="48" ry="14" fill="#f1f3f5" stroke="#adb5bd" stroke-width="1.5"/>
    <text x="648" y="196" text-anchor="middle" font-size="15" font-weight="700" fill="#16181b">DB</text>
    <circle cx="626" cy="232" r="11" fill="#12b886"/><text x="626" y="236.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">4</text>
    <text x="644" y="237" font-size="13" font-weight="700" fill="#087f5b">커밋</text>
  </g>
</svg>
