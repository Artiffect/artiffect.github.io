<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 352" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', system-ui, sans-serif">
  <rect width="720" height="352" fill="#f8f9fa"/>
  <defs>
    <marker id="tp-rn-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#868e96"/>
    </marker>
    <marker id="tp-rn-or" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#e8590c"/>
    </marker>
  </defs>

  <!-- 타임라인 영역 -->
  <rect x="24" y="20" width="468" height="176" rx="10" fill="#fff" stroke="#dee2e6"/>

  <!-- 바깥 트랜잭션 -->
  <text x="40" y="68" font-size="13" font-weight="700" fill="#343a40">바깥 트랜잭션</text>
  <text x="40" y="86" font-size="11.5" fill="#868e96">order() · 커넥션 1</text>
  <rect x="164" y="60" width="84" height="26" rx="4" fill="#12b886"/>
  <text x="206" y="77.5" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">시작</text>
  <rect x="248" y="60" width="144" height="26" fill="#fff" stroke="#12b886" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="320" y="77.5" text-anchor="middle" font-size="12" font-weight="600" fill="#087f5b">보류 (커넥션 유지)</text>
  <rect x="392" y="60" width="84" height="26" rx="4" fill="#12b886"/>
  <text x="434" y="77.5" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">재개</text>

  <!-- 안쪽 트랜잭션 -->
  <text x="40" y="128" font-size="13" font-weight="700" fill="#343a40">안쪽 트랜잭션</text>
  <text x="40" y="146" font-size="11.5" fill="#868e96">REQUIRES_NEW · 커넥션 2</text>
  <rect x="252" y="120" width="136" height="26" rx="4" fill="#12b886"/>
  <text x="320" y="137.5" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">새로 시작 → 커밋</text>

  <!-- 보류/재개 안내선 -->
  <line x1="256" y1="90" x2="256" y2="116" stroke="#adb5bd" stroke-width="1.5" marker-end="url(#tp-rn-ah)"/>
  <line x1="384" y1="120" x2="384" y2="90" stroke="#adb5bd" stroke-width="1.5" marker-end="url(#tp-rn-ah)"/>

  <!-- 시간축 -->
  <line x1="164" y1="172" x2="476" y2="172" stroke="#ced4da" stroke-width="1.5" marker-end="url(#tp-rn-ah)"/>
  <text x="164" y="164" font-size="11.5" fill="#868e96">시간</text>

  <!-- 커넥션 풀 -->
  <rect x="516" y="20" width="180" height="176" rx="10" fill="#fff" stroke="#dee2e6"/>
  <text x="606" y="48" text-anchor="middle" font-size="13" font-weight="700" fill="#343a40">커넥션 풀 (최대 10)</text>
  <g stroke="#ced4da" fill="#fff">
    <rect x="530" y="70" width="24" height="24" rx="4" fill="#12b886" stroke="#12b886"/>
    <rect x="562" y="70" width="24" height="24" rx="4" fill="#12b886" stroke="#12b886"/>
    <rect x="594" y="70" width="24" height="24" rx="4"/>
    <rect x="626" y="70" width="24" height="24" rx="4"/>
    <rect x="658" y="70" width="24" height="24" rx="4"/>
    <rect x="530" y="102" width="24" height="24" rx="4"/>
    <rect x="562" y="102" width="24" height="24" rx="4"/>
    <rect x="594" y="102" width="24" height="24" rx="4"/>
    <rect x="626" y="102" width="24" height="24" rx="4"/>
    <rect x="658" y="102" width="24" height="24" rx="4"/>
  </g>
  <text x="542" y="86.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">1</text>
  <text x="574" y="86.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">2</text>
  <text x="606" y="154" text-anchor="middle" font-size="12" font-weight="600" fill="#087f5b">요청 하나가 2개 사용</text>
  <text x="606" y="174" text-anchor="middle" font-size="11.5" fill="#868e96">안쪽이 끝날 때까지</text>

  <!-- 동시 요청 10개 -->
  <rect x="24" y="216" width="672" height="116" rx="10" fill="#fff" stroke="#dee2e6"/>
  <text x="44" y="244" font-size="13" font-weight="700" fill="#343a40">요청 10개가 동시에 바깥 트랜잭션을 시작하면</text>
  <g fill="#12b886">
    <rect x="44" y="260" width="28" height="28" rx="4"/>
    <rect x="80" y="260" width="28" height="28" rx="4"/>
    <rect x="116" y="260" width="28" height="28" rx="4"/>
    <rect x="152" y="260" width="28" height="28" rx="4"/>
    <rect x="188" y="260" width="28" height="28" rx="4"/>
    <rect x="224" y="260" width="28" height="28" rx="4"/>
    <rect x="260" y="260" width="28" height="28" rx="4"/>
    <rect x="296" y="260" width="28" height="28" rx="4"/>
    <rect x="332" y="260" width="28" height="28" rx="4"/>
    <rect x="368" y="260" width="28" height="28" rx="4"/>
  </g>
  <text x="44" y="314" font-size="11.5" fill="#868e96">풀의 10개를 모두 바깥 트랜잭션이 잡고 있음</text>

  <line x1="404" y1="274" x2="436" y2="274" stroke="#e8590c" stroke-width="1.5" marker-end="url(#tp-rn-or)"/>
  <rect x="440" y="236" width="240" height="80" rx="8" fill="#fff4e6" stroke="#e8590c" stroke-width="1.5"/>
  <text x="456" y="260" font-size="12.5" font-weight="700" fill="#e8590c">모두 두 번째 커넥션을 기다림</text>
  <text x="456" y="280" font-size="11.5" fill="#e8590c">connectionTimeout 30초 뒤</text>
  <text x="456" y="302" font-size="11" fill="#e8590c" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">SQLTransientConnectionException</text>
</svg>
