<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 336" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', system-ui, sans-serif">
  <rect width="720" height="336" fill="#f8f9fa"/>
  <defs>
    <marker id="tp-rq-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#868e96"/>
    </marker>
    <marker id="tp-rq-or" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#e8590c"/>
    </marker>
  </defs>

  <!-- 물리 트랜잭션 -->
  <rect x="24" y="20" width="672" height="220" rx="10" fill="#fff" stroke="#12b886" stroke-width="1.5"/>
  <text x="44" y="48" font-size="15" font-weight="700" fill="#087f5b">물리 트랜잭션</text>
  <text x="150" y="48" font-size="12" fill="#868e96">커넥션 1개 · 영속성 컨텍스트 1개</text>

  <!-- 바깥 논리 트랜잭션: order() -->
  <rect x="44" y="64" width="420" height="160" rx="8" fill="#fff" stroke="#dee2e6"/>
  <text x="60" y="90" font-size="14" font-weight="700" fill="#343a40">order()</text>
  <text x="122" y="90" font-size="12" fill="#868e96">논리 트랜잭션 · 새로 시작</text>
  <text x="60" y="114" font-size="11.5" fill="#495057" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">orderRepository.save(order)</text>

  <!-- 안쪽 논리 트랜잭션: apply() -->
  <rect x="60" y="126" width="388" height="58" rx="6" fill="#f8f9fa" stroke="#ced4da"/>
  <text x="76" y="150" font-size="14" font-weight="700" fill="#343a40">apply()</text>
  <text x="136" y="150" font-size="12" fill="#868e96">논리 트랜잭션 · 참여</text>
  <text x="76" y="172" font-size="12" font-weight="600" fill="#e8590c">RuntimeException 발생</text>

  <text x="60" y="210" font-size="12" fill="#868e96">catch로 예외를 잡고 계속 진행</text>

  <!-- 1: rollback-only 표시 -->
  <line x1="448" y1="155" x2="504" y2="155" stroke="#e8590c" stroke-width="1.5" marker-end="url(#tp-rq-or)"/>
  <circle cx="476" cy="136" r="11" fill="#12b886"/><text x="476" y="140.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">1</text>
  <rect x="508" y="126" width="168" height="58" rx="6" fill="#fff4e6" stroke="#e8590c" stroke-width="1.5"/>
  <text x="592" y="151" text-anchor="middle" font-size="13" font-weight="700" fill="#e8590c">rollback-only</text>
  <text x="592" y="171" text-anchor="middle" font-size="11.5" fill="#e8590c">물리 트랜잭션에 표시</text>

  <!-- 표시 확인 선 -->
  <path d="M592 184 V248 H342 V256" fill="none" stroke="#adb5bd" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#tp-rq-ah)"/>

  <!-- 2: 커밋 요청 -->
  <rect x="24" y="260" width="188" height="56" rx="8" fill="#fff" stroke="#dee2e6"/>
  <circle cx="46" cy="282" r="11" fill="#12b886"/><text x="46" y="286.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">2</text>
  <text x="64" y="287" font-size="13" font-weight="700" fill="#343a40">order() 종료</text>
  <text x="40" y="306" font-size="11.5" fill="#868e96">커밋 요청</text>

  <line x1="212" y1="288" x2="244" y2="288" stroke="#868e96" stroke-width="1.5" marker-end="url(#tp-rq-ah)"/>

  <!-- 3: 롤백 -->
  <rect x="248" y="260" width="188" height="56" rx="8" fill="#fff" stroke="#dee2e6"/>
  <circle cx="270" cy="282" r="11" fill="#12b886"/><text x="270" y="286.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">3</text>
  <text x="288" y="287" font-size="13" font-weight="700" fill="#343a40">표시를 보고 롤백</text>
  <text x="264" y="306" font-size="11.5" fill="#868e96">주문 저장도 취소</text>

  <line x1="436" y1="288" x2="468" y2="288" stroke="#e8590c" stroke-width="1.5" marker-end="url(#tp-rq-or)"/>

  <!-- 4: 예외 -->
  <rect x="472" y="260" width="224" height="56" rx="8" fill="#fff4e6" stroke="#e8590c" stroke-width="1.5"/>
  <text x="488" y="283" font-size="12.5" font-weight="700" fill="#e8590c">호출한 쪽에 예외</text>
  <text x="488" y="303" font-size="11" fill="#e8590c" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">UnexpectedRollbackException</text>
</svg>
