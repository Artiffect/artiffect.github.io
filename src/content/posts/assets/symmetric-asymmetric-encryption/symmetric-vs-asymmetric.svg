<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 456" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', system-ui, sans-serif">
  <rect width="720" height="456" fill="#f8f9fa"/>
