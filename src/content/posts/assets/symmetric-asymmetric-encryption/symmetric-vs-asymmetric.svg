    <text x="368" y="106" fill="#454a51">암호문</text>
    <text x="368" y="124" font-size="11" font-weight="400" fill="#868e96">x8#qL2…</text>
    <rect x="464" y="80" width="96" height="56" rx="8" fill="#e6fcf5" stroke="#63e6be"/>
    <text x="512" y="113" fill="#087f5b">복호화</text>
