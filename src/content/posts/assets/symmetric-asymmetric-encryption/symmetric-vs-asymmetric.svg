  <line x1="224" y1="160" x2="224" y2="140" stroke="#12b886" stroke-width="1.5"/>
  <line x1="512" y1="160" x2="512" y2="140" stroke="#12b886" stroke-width="1.5"/>
  <path d="M264 173 H472" fill="none" stroke="#e8590c" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="368" y="208" text-anchor="middle" font-size="12.5" font-weight="600" fill="#e8590c">이 키를 상대에게 어떻게 안전하게 건넬까?</text>

  <line x1="32" y1="232" x2="688" y2="232" stroke="#dee2e6"/>

  <!-- ===== 비대칭키 ===== -->
