    <rect x="320" y="308" width="96" height="56" rx="8" fill="#fff" stroke="#adb5bd" stroke-dasharray="4 3"/>
    <text x="368" y="334" fill="#454a51">암호문</text>
    <text x="368" y="352" font-size="11" font-weight="400" fill="#868e96">9fR!w0…</text>
    <rect x="464" y="308" width="96" height="56" rx="8" fill="#e7f5ff" stroke="#74c0fc"/>
    <text x="512" y="341" fill="#1864ab">복호화</text>
