    <line x1="272" y1="108" x2="316" y2="108" marker-end="url(#sa-n)"/>
    <line x1="416" y1="108" x2="460" y2="108" marker-end="url(#sa-n)"/>
    <line x1="560" y1="108" x2="604" y2="108" marker-end="url(#sa-n)"/>
  </g>

  <!-- 같은 키 -->
  <g font-size="12" font-weight="700" text-anchor="middle" fill="#087f5b">
    <rect x="184" y="160" width="80" height="26" rx="13" fill="#e6fcf5" stroke="#12b886"/>
    <text x="224" y="177">키 K</text>
    <rect x="472" y="160" width="80" height="26" rx="13" fill="#e6fcf5" stroke="#12b886"/>
