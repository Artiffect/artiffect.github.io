  <line x1="374" y1="84" x2="404" y2="84" stroke="#868e96" stroke-width="1.5" marker-end="url(#tx-tr-n)"/>

  <rect x="408" y="56" width="288" height="56" rx="6" fill="#fff4e6" stroke="#e8590c" stroke-width="1.5"/>
  <text x="552" y="80" text-anchor="middle" font-size="13.5" font-weight="700" fill="#16181b">계좌 1 40만 · 계좌 2 30만</text>
  <text x="552" y="100" text-anchor="middle" font-size="12" font-weight="600" fill="#e8590c">합계 70만, 10만 원이 사라짐</text>

  <line x1="24" y1="148" x2="696" y2="148" stroke="#dee2e6"/>

  <!-- ===== 트랜잭션으로 묶으면 ===== -->
  <text x="24" y="182" font-size="15" font-weight="700" fill="#16181b">트랜잭션으로 묶으면</text>

  <rect x="14" y="194" width="368" height="84" rx="10" fill="none" stroke="#12b886" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="372" y="182" text-anchor="end" font-size="11.5" font-weight="600" fill="#087f5b">START TRANSACTION ~ ROLLBACK</text>

