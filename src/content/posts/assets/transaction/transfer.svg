    <marker id="tx-tr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#12b886"/></marker>
  </defs>

  <!-- ===== 트랜잭션 없이 ===== -->
