  <rect x="248" y="208" width="124" height="56" rx="6" fill="#fff" stroke="#12b886" stroke-width="2"/>
  <text x="310" y="232" text-anchor="middle" font-size="13" font-weight="700" fill="#087f5b">ROLLBACK</text>
  <text x="310" y="252" text-anchor="middle" font-size="12" fill="#6e747c">출금 취소</text>

  <line x1="384" y1="236" x2="404" y2="236" stroke="#12b886" stroke-width="1.5" marker-end="url(#tx-tr-g)"/>

  <rect x="408" y="208" width="288" height="56" rx="6" fill="#e6fcf5" stroke="#12b886" stroke-width="1.5"/>
  <text x="552" y="232" text-anchor="middle" font-size="13.5" font-weight="700" fill="#16181b">계좌 1 50만 · 계좌 2 30만</text>
  <text x="552" y="252" text-anchor="middle" font-size="12" font-weight="600" fill="#087f5b">합계 80만, 처음 잔액 그대로</text>
