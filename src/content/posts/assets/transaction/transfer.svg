  <text x="86" y="232" text-anchor="middle" font-size="13" font-weight="700" fill="#16181b">계좌 1 출금</text>
  <text x="86" y="252" text-anchor="middle" font-size="12" fill="#6e747c">50만 → 40만</text>

  <line x1="150" y1="236" x2="180" y2="236" stroke="#868e96" stroke-width="1.5" marker-end="url(#tx-tr-n)"/>
