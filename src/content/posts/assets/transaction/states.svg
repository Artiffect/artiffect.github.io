  <text x="379" y="80" text-anchor="middle" font-size="11.5" fill="#868e96">Partially Committed</text>

  <rect x="554" y="36" width="142" height="56" rx="8" fill="#e6fcf5" stroke="#12b886" stroke-width="2"/>
