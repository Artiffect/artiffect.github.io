<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 352" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', system-ui, sans-serif">
  <rect width="720" height="352" fill="#f8f9fa"/>
  <defs>
    <marker id="tx-ur-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#868e96"/></marker>
    <marker id="tx-ur-l" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#adb5bd"/></marker>
    <marker id="tx-ur-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#12b886"/></marker>
  </defs>

  <!-- UPDATE -->
  <rect x="130" y="20" width="460" height="40" rx="6" fill="#fff" stroke="#dee2e6"/>
  <text x="360" y="45" text-anchor="middle" font-size="12.5" fill="#343a40" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">UPDATE account SET balance = 400000 WHERE id = 1</text>

  <g stroke="#868e96" stroke-width="1.5" fill="none">
    <path d="M200 60 V78 H124 V96" marker-end="url(#tx-ur-n)"/>
    <line x1="360" y1="60" x2="360" y2="96" marker-end="url(#tx-ur-n)"/>
    <path d="M520 60 V78 H596 V96" marker-end="url(#tx-ur-n)"/>
  </g>

  <!-- 메모리 쪽 세 상자 -->
  <rect x="24" y="100" width="200" height="88" rx="8" fill="#fff" stroke="#dee2e6"/>
  <text x="124" y="126" text-anchor="middle" font-size="14" font-weight="700" fill="#16181b">undo 로그</text>
  <text x="124" y="146" text-anchor="middle" font-size="12" fill="#868e96">바꾸기 전 값</text>
  <text x="124" y="172" text-anchor="middle" font-size="13" font-weight="700" fill="#343a40">id=1 · 500,000</text>

  <rect x="260" y="100" width="200" height="88" rx="8" fill="#fff" stroke="#dee2e6"/>
  <text x="360" y="126" text-anchor="middle" font-size="14" font-weight="700" fill="#16181b">버퍼 풀의 데이터 페이지</text>
  <text x="360" y="146" text-anchor="middle" font-size="12" fill="#868e96">메모리에서 먼저 수정</text>
  <text x="360" y="172" text-anchor="middle" font-size="13" font-weight="700" fill="#343a40">id=1 · 400,000</text>

  <rect x="496" y="100" width="200" height="88" rx="8" fill="#fff" stroke="#12b886" stroke-width="2"/>
  <text x="596" y="126" text-anchor="middle" font-size="14" font-weight="700" fill="#16181b">redo 로그</text>
  <text x="596" y="146" text-anchor="middle" font-size="12" fill="#868e96">바꾼 뒤 값</text>
  <text x="596" y="172" text-anchor="middle" font-size="13" font-weight="700" fill="#087f5b">id=1 · 400,000</text>

  <!-- 디스크로 -->
  <line x1="360" y1="188" x2="360" y2="236" stroke="#adb5bd" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#tx-ur-l)"/>
  <text x="370" y="217" font-size="12" fill="#868e96">나중에 기록</text>
  <line x1="596" y1="188" x2="596" y2="236" stroke="#12b886" stroke-width="2" marker-end="url(#tx-ur-g)"/>
  <text x="606" y="217" font-size="12" font-weight="600" fill="#087f5b">COMMIT 때 기록</text>

  <rect x="260" y="240" width="200" height="44" rx="8" fill="#f1f3f5" stroke="#adb5bd"/>
  <text x="360" y="267" text-anchor="middle" font-size="13" font-weight="700" fill="#343a40">데이터 파일 <tspan font-size="11.5" font-weight="400" fill="#868e96">디스크</tspan></text>
  <rect x="496" y="240" width="200" height="44" rx="8" fill="#e6fcf5" stroke="#12b886" stroke-width="1.5"/>
  <text x="596" y="267" text-anchor="middle" font-size="13" font-weight="700" fill="#087f5b">redo 로그 파일 <tspan font-size="11.5" font-weight="400" fill="#868e96">디스크</tspan></text>

  <!-- undo 쓰임 -->
  <g font-size="12.5" fill="#454a51">
    <text x="32" y="256"><tspan font-weight="700" fill="#087f5b">ROLLBACK</tspan>  이 값으로 되돌림</text>
    <text x="32" y="280"><tspan font-weight="700" fill="#087f5b">다른 세션</tspan>  이 값을 읽음</text>
  </g>

  <!-- 장애 복구 -->
  <line x1="24" y1="304" x2="696" y2="304" stroke="#dee2e6"/>
  <text x="24" y="330" font-size="12.5" fill="#454a51"><tspan font-weight="700" fill="#16181b">장애 후 재시작</tspan>  redo 로그로 커밋된 변경을 다시 적용하고, 커밋 안 된 변경은 undo 로그로 되돌립니다.</text>
</svg>
