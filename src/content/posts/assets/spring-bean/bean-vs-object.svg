<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 312" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', system-ui, sans-serif">
  <rect width="720" height="312" fill="#f8f9fa"/>
  <defs>
    <marker id="sb-bo-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#868e96"/>
    </marker>
    <marker id="sb-bo-gr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#12b886"/>
    </marker>
  </defs>

  <!-- 같은 클래스 -->
  <rect x="270" y="20" width="180" height="44" rx="8" fill="#fff" stroke="#adb5bd"/>
  <text x="360" y="47" text-anchor="middle" font-size="14" font-weight="700" fill="#16181b">OrderService 클래스</text>

  <!-- 갈래 -->
  <path d="M320 64 V84 H180 V136" fill="none" stroke="#868e96" stroke-width="1.5" marker-end="url(#sb-bo-ah)"/>
  <text x="192" y="112" font-size="12" font-weight="600" fill="#454a51">내 코드가 new로 생성</text>
  <path d="M400 64 V84 H540 V116" fill="none" stroke="#12b886" stroke-width="2" marker-end="url(#sb-bo-gr)"/>
  <text x="552" y="106" font-size="12" font-weight="600" fill="#087f5b">컨테이너가 생성</text>

  <!-- ===== 왼쪽: 일반 객체 ===== -->
  <rect x="98" y="140" width="164" height="56" rx="8" fill="#fff" stroke="#dee2e6"/>
  <text x="180" y="164" text-anchor="middle" font-size="14" font-weight="700" fill="#16181b">일반 객체</text>
  <text x="180" y="184" text-anchor="middle" font-size="11" fill="#6e747c">new OrderService(...)</text>
  <text x="180" y="240" text-anchor="middle" font-size="12.5" fill="#e8590c">컨테이너가 모르는 객체</text>
  <text x="180" y="259" text-anchor="middle" font-size="12.5" fill="#e8590c">의존성도 직접 넣어야 함</text>
  <text x="180" y="278" text-anchor="middle" font-size="12.5" fill="#e8590c">@Transactional 적용 안 됨</text>

  <!-- ===== 오른쪽: 빈 ===== -->
  <rect x="392" y="120" width="296" height="96" rx="10" fill="#fff" stroke="#63e6be" stroke-width="1.5"/>
  <text x="406" y="141" font-size="13" font-weight="700" fill="#087f5b">ApplicationContext</text>
  <rect x="406" y="154" width="120" height="44" rx="8" fill="#e6fcf5" stroke="#63e6be"/>
  <text x="466" y="181" text-anchor="middle" font-size="12" font-weight="700" fill="#087f5b">discountPolicy</text>
  <rect x="554" y="154" width="120" height="44" rx="8" fill="#e6fcf5" stroke="#63e6be"/>
  <text x="614" y="181" text-anchor="middle" font-size="12" font-weight="700" fill="#087f5b">orderService</text>
  <line x1="526" y1="176" x2="550" y2="176" stroke="#12b886" stroke-width="2" marker-end="url(#sb-bo-gr)"/>

  <text x="540" y="240" text-anchor="middle" font-size="12.5" fill="#087f5b">이름으로 등록해 관리</text>
  <text x="540" y="259" text-anchor="middle" font-size="12.5" fill="#087f5b">필요한 빈을 찾아 주입</text>
  <text x="540" y="278" text-anchor="middle" font-size="12.5" fill="#087f5b">프록시로 트랜잭션 적용</text>
</svg>
