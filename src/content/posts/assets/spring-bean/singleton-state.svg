<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 328" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', system-ui, sans-serif">
  <rect width="720" height="328" fill="#f8f9fa"/>
  <defs>
    <marker id="sb-ss-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#868e96"/>
    </marker>
    <marker id="sb-ss-or" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#e8590c"/>
    </marker>
  </defs>

  <!-- 머리 -->
  <rect x="80" y="20" width="120" height="40" rx="8" fill="#fff" stroke="#dee2e6"/>
  <text x="140" y="45" text-anchor="middle" font-size="13" font-weight="700" fill="#16181b">요청 A 스레드</text>
  <rect x="270" y="20" width="180" height="40" rx="8" fill="#e6fcf5" stroke="#63e6be"/>
  <text x="360" y="45" text-anchor="middle" font-size="13" font-weight="700" fill="#087f5b">orderService 빈 하나</text>
  <rect x="520" y="20" width="120" height="40" rx="8" fill="#fff" stroke="#dee2e6"/>
  <text x="580" y="45" text-anchor="middle" font-size="13" font-weight="700" fill="#16181b">요청 B 스레드</text>

  <!-- 생명선 -->
  <g stroke="#ced4da" stroke-width="1.5" stroke-dasharray="4 4">
    <line x1="140" y1="60" x2="140" y2="276"/>
    <line x1="360" y1="60" x2="360" y2="276"/>
    <line x1="580" y1="60" x2="580" y2="276"/>
  </g>

  <!-- 1. A가 씀 -->
  <text x="128" y="106" text-anchor="end" font-size="12" font-weight="600" fill="#454a51">order(10000)</text>
  <line x1="140" y1="102" x2="306" y2="102" stroke="#868e96" stroke-width="1.5" marker-end="url(#sb-ss-ah)"/>
  <text x="223" y="94" text-anchor="middle" font-size="11.5" fill="#6e747c">price = 10000</text>
  <rect x="310" y="88" width="100" height="28" rx="6" fill="#fff" stroke="#adb5bd"/>
  <text x="360" y="107" text-anchor="middle" font-size="12" fill="#343a40">price 10000</text>

  <!-- 2. B가 덮어씀 -->
  <text x="592" y="154" font-size="12" font-weight="600" fill="#454a51">order(20000)</text>
  <line x1="580" y1="150" x2="414" y2="150" stroke="#868e96" stroke-width="1.5" marker-end="url(#sb-ss-ah)"/>
  <text x="497" y="142" text-anchor="middle" font-size="11.5" fill="#6e747c">price = 20000</text>
  <rect x="310" y="136" width="100" height="28" rx="6" fill="#fff" stroke="#e8590c"/>
  <text x="360" y="155" text-anchor="middle" font-size="12" font-weight="600" fill="#e8590c">price 20000</text>

  <!-- 3. A가 읽음 -->
  <line x1="360" y1="198" x2="144" y2="198" stroke="#e8590c" stroke-width="2" marker-end="url(#sb-ss-or)"/>
  <text x="252" y="190" text-anchor="middle" font-size="11.5" font-weight="600" fill="#e8590c">20000을 읽음</text>
  <text x="128" y="196" text-anchor="end" font-size="12" font-weight="700" fill="#e8590c">18000 반환</text>
  <text x="128" y="214" text-anchor="end" font-size="11" fill="#e8590c">(기대값 9000)</text>

  <!-- 4. B가 읽음 -->
  <line x1="360" y1="246" x2="576" y2="246" stroke="#868e96" stroke-width="1.5" marker-end="url(#sb-ss-ah)"/>
  <text x="468" y="238" text-anchor="middle" font-size="11.5" fill="#6e747c">20000을 읽음</text>
  <text x="592" y="250" font-size="12" font-weight="600" fill="#454a51">18000 반환</text>

  <text x="360" y="308" text-anchor="middle" font-size="12.5" fill="#868e96">10% 할인 정책 · 두 요청이 price 필드 하나를 함께 씀</text>
</svg>
