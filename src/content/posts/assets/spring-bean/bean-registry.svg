<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 316" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', system-ui, sans-serif">
  <rect width="720" height="316" fill="#f8f9fa"/>
  <defs>
    <marker id="sb-br-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#868e96"/>
    </marker>
    <marker id="sb-br-gr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#12b886"/>
    </marker>
    <marker id="sb-br-or" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#e8590c"/>
    </marker>
  </defs>

  <!-- 등록 방법 -->
  <rect x="24" y="44" width="152" height="56" rx="8" fill="#fff" stroke="#dee2e6"/>
  <text x="100" y="67" text-anchor="middle" font-size="13" font-weight="700" fill="#16181b">컴포넌트 스캔</text>
  <text x="100" y="87" text-anchor="middle" font-size="11" fill="#6e747c">@Component 클래스</text>
  <rect x="24" y="124" width="152" height="56" rx="8" fill="#fff" stroke="#dee2e6"/>
  <text x="100" y="147" text-anchor="middle" font-size="13" font-weight="700" fill="#16181b">@Bean 메서드</text>
  <text x="100" y="167" text-anchor="middle" font-size="11" fill="#6e747c">@Configuration 클래스 안</text>
  <g stroke="#868e96" stroke-width="1.5">
    <line x1="176" y1="72" x2="202" y2="72" marker-end="url(#sb-br-ah)"/>
    <line x1="176" y1="152" x2="202" y2="152" marker-end="url(#sb-br-ah)"/>
  </g>

  <!-- 컨테이너 -->
  <rect x="206" y="20" width="490" height="180" rx="10" fill="#fff" stroke="#63e6be" stroke-width="1.5"/>
  <text x="222" y="44" font-size="14" font-weight="700" fill="#087f5b">ApplicationContext</text>
  <g font-size="11" fill="#868e96">
    <text x="226" y="70">빈 이름</text>
    <text x="410" y="70">타입</text>
    <text x="590" y="70">등록 방법</text>
  </g>
  <line x1="222" y1="78" x2="680" y2="78" stroke="#dee2e6"/>
  <g font-size="12.5" fill="#343a40">
    <text x="226" y="102" font-weight="600">orderService</text>
    <text x="410" y="102">OrderService</text>
    <text x="590" y="102" fill="#868e96">스캔</text>
    <text x="226" y="128" font-weight="600">fixDiscountPolicy</text>
    <text x="410" y="128">FixDiscountPolicy</text>
    <text x="590" y="128" fill="#868e96">스캔</text>
    <text x="226" y="154" font-weight="600">rateDiscountPolicy</text>
    <text x="410" y="154">RateDiscountPolicy</text>
    <text x="590" y="154" fill="#868e96">스캔</text>
    <text x="226" y="180" font-weight="600">clock</text>
    <text x="410" y="180">Clock</text>
    <text x="590" y="180" fill="#868e96">@Bean</text>
  </g>
  <rect x="400" y="111" width="166" height="50" rx="6" fill="none" stroke="#adb5bd" stroke-dasharray="4 3"/>

  <!-- 조회 -->
  <rect x="24" y="220" width="672" height="36" rx="6" fill="#fff" stroke="#dee2e6"/>
  <text x="40" y="243" font-size="12.5" fill="#343a40">getBean("orderService")</text>
  <line x1="290" y1="238" x2="330" y2="238" stroke="#12b886" stroke-width="2" marker-end="url(#sb-br-gr)"/>
  <text x="344" y="243" font-size="12.5" font-weight="600" fill="#087f5b">이름이 같은 빈 하나를 반환</text>

  <rect x="24" y="264" width="672" height="36" rx="6" fill="#fff" stroke="#dee2e6"/>
  <text x="40" y="287" font-size="12.5" fill="#343a40">getBean(DiscountPolicy.class)</text>
  <line x1="290" y1="282" x2="330" y2="282" stroke="#e8590c" stroke-width="2" marker-end="url(#sb-br-or)"/>
  <text x="344" y="287" font-size="12.5" font-weight="600" fill="#e8590c">후보 2개 → NoUniqueBeanDefinitionException</text>
</svg>
