name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # Actions 탭에서 수동 실행

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치면 진행 중인 배포는 끝까지 두고 다음 것을 대기
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "11.3.0" # ci.yml과 동일

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Google Fonts 다운로드가 간헐적으로 실패해서 최대 3회 재시도
      - name: Build
        run: |
          for i in 1 2 3; do
            pnpm run build && exit 0
            echo "::warning::Build attempt $i failed, retrying in 10s..."
            sleep 10
          done
          exit 1

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
